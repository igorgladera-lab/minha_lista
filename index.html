<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">

<!-- iOS / Android: instalação na tela inicial -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Minha Lista">
<meta name="mobile-web-app-capable" content="yes">

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<title>📋 Minha Lista</title>

<!-- Favicon SVG inline (emoji 📋 em fundo azul) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Ctext x='50' y='50' font-size='60' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Aplica o tema ANTES do CSS pintar (evita flash) -->
<script>
  (function () {
    try {
      var salvo = localStorage.getItem('minhaLista_tema');
      if (salvo === 'escuro' || salvo === 'claro') {
        document.documentElement.setAttribute('data-tema', salvo);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-tema', 'escuro');
      }
    } catch (e) {}
  })();
</script>

<style>
  :root {
    --azul: #2563eb;
    --azul-escuro: #1d4ed8;
    --cinza-borda: #e5e7eb;
    --cinza-texto: #6b7280;
    --cinza-fundo: #f9fafb;
    --branco: #ffffff;
    --texto: #111827;
    --vermelho: #dc2626;
    --hover-excluir: #fee2e2;
    --raio: 12px;
  }

  /* Tema escuro */
  html[data-tema="escuro"] {
    --azul: #3b82f6;
    --azul-escuro: #60a5fa;
    --cinza-borda: #2f3742;
    --cinza-texto: #9ca3af;
    --cinza-fundo: #0f1419;
    --branco: #1a1f26;
    --texto: #e5e7eb;
    --vermelho: #f87171;
    --hover-excluir: #3b1d1d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--cinza-fundo);
    color: var(--texto);
    -webkit-tap-highlight-color: transparent;
    transition: background .25s, color .25s;
  }

  body {
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  header {
    background: var(--branco);
    padding: 16px;
    border-bottom: 1px solid var(--cinza-borda);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: background .25s, border-color .25s;
  }

  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    color: var(--texto);
  }

  #btnTema {
    background: var(--cinza-fundo);
    border: 1px solid var(--cinza-borda);
    color: var(--texto);
    font-size: 18px;
    line-height: 1;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, transform .1s, border-color .25s;
    flex-shrink: 0;
    padding: 0;
  }

  #btnTema:hover { background: var(--cinza-borda); }
  #btnTema:active { transform: scale(0.9); }

  .input-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--branco);
    border-bottom: 1px solid var(--cinza-borda);
    position: sticky;
    top: 0;
    z-index: 10;
    transition: background .25s, border-color .25s;
  }

  .input-bar input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid var(--cinza-borda);
    border-radius: var(--raio);
    outline: none;
    background: var(--cinza-fundo);
    color: var(--texto);
    transition: border-color .15s, background .25s, color .25s;
  }

  .input-bar input:focus {
    border-color: var(--azul);
    background: var(--branco);
  }

  .input-bar input::placeholder {
    color: var(--cinza-texto);
  }

  .input-bar button {
    padding: 0 18px;
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    background: var(--azul);
    border: none;
    border-radius: var(--raio);
    cursor: pointer;
    transition: background .15s, transform .05s;
    flex-shrink: 0;
  }

  .input-bar button:hover { background: var(--azul-escuro); }
  .input-bar button:active { transform: scale(0.96); }

  main { padding: 12px 16px 24px; }

  #lista { list-style: none; margin: 0; padding: 0; }

  .chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: var(--raio);
    padding: 12px 14px;
    margin-bottom: 8px;
    animation: slideIn .18s ease-out;
    transition: background .25s, border-color .25s;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .chip .texto {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 15px;
    color: var(--texto);
  }

  .chip .excluir {
    background: none;
    border: none;
    color: var(--vermelho);
    font-size: 20px;
    line-height: 1;
    padding: 4px 8px;
    cursor: pointer;
    border-radius: 8px;
    transition: background .15s;
    flex-shrink: 0;
  }

  .chip .excluir:hover { background: var(--hover-excluir); }
  .chip .excluir:active { transform: scale(0.9); }

  .vazio {
    text-align: center;
    color: var(--cinza-texto);
    padding: 40px 20px;
    font-size: 15px;
  }

  .vazio .emoji {
    display: block;
    font-size: 40px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>📋 Minha Lista</h1>
  <button type="button" id="btnTema" aria-label="Alternar tema claro/escuro" title="Alternar tema">🌙</button>
</header>

<section class="input-bar">
  <input
    type="text"
    id="inputItem"
    placeholder="Digite um item..."
    autocomplete="off"
    autocapitalize="sentences"
    enterkeyhint="done"
  >
  <button type="button" id="btnAdd" aria-label="Adicionar item">➕</button>
</section>

<main>
  <ul id="lista"></ul>
</main>

<template id="chipTemplate">
  <li class="chip">
    <span class="texto"></span>
    <button type="button" class="excluir" data-acao="excluir" aria-label="Excluir item">✖</button>
  </li>
</template>

<script>
(function () {
  'use strict';

  const CHAVE_ITENS = 'minhaLista_itens';
  const CHAVE_TEMA  = 'minhaLista_tema';

  const input   = document.getElementById('inputItem');
  const btnAdd  = document.getElementById('btnAdd');
  const lista   = document.getElementById('lista');
  const tpl     = document.getElementById('chipTemplate');
  const btnTema = document.getElementById('btnTema');
  const htmlEl  = document.documentElement;

  let itens = [];

  // ---------- Persistência: itens ----------
  function carregarItens() {
    try {
      const raw = localStorage.getItem(CHAVE_ITENS);
      itens = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(itens)) itens = [];
    } catch (e) { itens = []; }
  }

  function salvarItens() {
    try { localStorage.setItem(CHAVE_ITENS, JSON.stringify(itens)); }
    catch (e) { console.warn('Não foi possível salvar:', e); }
  }

  // ---------- Ações ----------
  function adicionarItem(texto) {
    const t = (texto || '').trim();
    if (!t) { input.focus(); return; }
    itens.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      texto: t,
      criadoEm: new Date().toISOString()
    });
    salvarItens();
    renderizar();
    input.value = '';
    input.focus();
  }

  function excluirItem(id) {
    itens = itens.filter(function (i) { return i.id !== id; });
    salvarItens();
    renderizar();
  }

  // ---------- Renderização ----------
  function renderizar() {
    lista.innerHTML = '';

    if (itens.length === 0) {
      const vazio = document.createElement('li');
      vazio.className = 'vazio';
      vazio.innerHTML = '<span class="emoji">📋</span>Nenhum item na lista ainda.<br>Adicione o primeiro acima!';
      lista.appendChild(vazio);
      return;
    }

    itens.forEach(function (item) {
      const node = tpl.content.firstElementChild.cloneNode(true);
      node.dataset.id = item.id;
      node.querySelector('.texto').textContent = item.texto;
      lista.appendChild(node);
    });
  }

  // ---------- Tema ----------
  function temaAtual() {
    return htmlEl.getAttribute('data-tema') === 'escuro' ? 'escuro' : 'claro';
  }

  function aplicarTema(tema) {
    if (tema === 'escuro') {
      htmlEl.setAttribute('data-tema', 'escuro');
      btnTema.textContent = '☀️';
    } else {
      htmlEl.removeAttribute('data-tema');
      btnTema.textContent = '🌙';
    }
    try { localStorage.setItem(CHAVE_TEMA, tema); } catch (e) {}
  }

  function iniciarBotaoTema() {
    if (temaAtual() === 'escuro') {
      btnTema.textContent = '☀️';
    } else {
      btnTema.textContent = '🌙';
    }
    btnTema.addEventListener('click', function () {
      aplicarTema(temaAtual() === 'escuro' ? 'claro' : 'escuro');
    });
  }

  // ---------- Eventos ----------
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      adicionarItem(input.value);
    }
  });

  btnAdd.addEventListener('click', function () {
    adicionarItem(input.value);
  });

  lista.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-acao="excluir"]');
    if (!btn) return;
    const li = btn.closest('li');
    if (!li || !li.dataset.id) return;
    excluirItem(li.dataset.id);
  });

  // ---------- Init ----------
  carregarItens();
  renderizar();
  iniciarBotaoTema();
  input.focus();
})();
</script>

<!-- ===== Service Worker (necessário para instalação PWA no Android) ===== -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        // falha silenciosa: o app continua funcional sem SW
      });
    });
  }
</script>

</body>
</html>
